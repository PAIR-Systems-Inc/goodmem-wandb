[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "goodmem-wandb"
version = "0.1.0"
description = "GoodMem client for wandb agent integrations — semantic memory storage, retrieval, and summarization."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "PairSys" },
]
keywords = ["goodmem", "wandb", "memory", "rag", "vector-search", "llm", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://goodmem.ai/"
Source = "https://github.com/PAIR-Systems-Inc/goodmem-wandb"
Issues = "https://github.com/PAIR-Systems-Inc/goodmem-wandb/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/goodmem_wandb"]

[tool.hatch.build.targets.sdist]
include = [
    "src/goodmem_wandb",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
