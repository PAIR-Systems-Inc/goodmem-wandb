name: Publish to PyPI

# Two triggers:
#   - Push a version tag like v0.1.0 (recommended path).
#   - Manually run from the Actions tab (workflow_dispatch) for ad-hoc releases.
#
# Authentication uses PyPI Trusted Publishing (OIDC). Configure the trusted
# publisher once on https://pypi.org/manage/account/publishing/ with:
#
#   PyPI project name : goodmem-wandb
#   Owner             : PAIR-Systems-Inc
#   Repository name   : goodmem-wandb
#   Workflow filename : publish.yml
#   Environment name  : pypi
#
# After the first publish you can revisit the publisher page to lock it to the
# `pypi` environment configured in this repo's settings (Settings -> Environments).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/goodmem-wandb/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # No username/password / token — OIDC trusted publishing handles auth.
